# The iOS app (ADR 0025). xcodegen makes HerdrRemote.xcodeproj from this file:
#   cd ios && xcodegen generate
# The .xcodeproj is not in git.
name: HerdrRemote
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Core:
    path: Core
settings:
  base:
    # The app's bundle ID. The extensions add a suffix. A free team that cannot register
    # dev.herdrremote builds the device app with HR_BUNDLE_ID=<unique id>.
    HR_BUNDLE_ID: dev.herdrremote
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1"
targets:
  HerdrRemote:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # One copy of xterm.js and live.html for both apps (decision 9).
      - path: ../android/app/src/main/assets/xterm
        type: folder
        buildPhase: resources
      - path: ../android/app/src/main/res/font/jetbrains_mono_regular.ttf
        buildPhase: resources
      - path: ../android/app/src/main/res/font/jetbrains_mono_bold.ttf
        buildPhase: resources
      - path: ../android/app/src/main/assets/licenses/JetBrainsMono-OFL.txt
        buildPhase: resources
    dependencies:
      - package: Core
      - target: HerdrRemoteNotificationContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HR_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HerdrRemote.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Herdr Remote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  HerdrRemoteNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - NotificationContent
      - Shared
    dependencies:
      - package: Core
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HR_BUNDLE_ID).content
        INFOPLIST_FILE: NotificationContent/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Herdr Remote
        CODE_SIGN_ENTITLEMENTS: NotificationContent/NotificationContent.entitlements
  HerdrRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: HerdrRemote
      - package: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdrremote.tests
        GENERATE_INFOPLIST_FILE: YES
  HerdrRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: HerdrRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdrremote.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HerdrRemote:
    build:
      targets:
        HerdrRemote: all
    test:
      targets:
        - HerdrRemoteTests
        - HerdrRemoteUITests
